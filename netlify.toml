[build]
  command = "npm run check"
  publish = "public"

[build.environment]
  NODE_VERSION = "24"

# This site owns ezevillo.com. Each project keeps its independent deployment.
# Keep these rules before any future catch-all; never proxy the rates gateway.
[[redirects]]
  from = "/ibit-to-btc/*"
  to = "https://neon-macaron-a52e5c.netlify.app/ibit-to-btc/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/git-review-workflow/*"
  to = "https://ezevillo-git-review-workflow.netlify.app/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/truco-a-3"
  to = "https://ezevillo-truco-a-3.netlify.app/truco-a-3/"
  status = 200
  force = true

[[redirects]]
  from = "/truco-a-3/*"
  to = "https://ezevillo-truco-a-3.netlify.app/truco-a-3/:splat"
  status = 200
  force = true

# Netlify applies these to this site's static files. Proxied responses retain
# the origin project's headers, including IBIT's CSP and its Cloudflare origin.
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "DENY"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Content-Security-Policy = "default-src 'none'; style-src 'self' 'unsafe-inline'; script-src 'self' 'sha256-YsbJX2CT5tYU5V3dis8SnkJ3GxMm2SnIjFYxu4v//ps='; img-src 'self'; font-src 'self'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'; upgrade-insecure-requests"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=86400"

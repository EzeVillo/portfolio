[build]
  command = "npm run check"
  publish = "public"

[build.environment]
  NODE_VERSION = "24"

# This site owns ezevillo.com. Each project keeps its independent deployment.
# Keep these rules before any future catch-all; never proxy the rates gateway.
# BEGIN GENERATED ROUTES
# Generated from config/routes.mjs by npm run routes.
[[redirects]]
  from = "https://ezevillo-portfolio.netlify.app/*"
  to = "https://ezevillo.com/:splat"
  status = 301
  force = true

[[redirects]]
  from = "/ibit-to-btc"
  to = "https://ezevillo-ibit-to-btc.netlify.app/ibit-to-btc/"
  status = 200
  force = true

[[redirects]]
  from = "/ibit-to-btc/*"
  to = "https://ezevillo-ibit-to-btc.netlify.app/ibit-to-btc/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/git-review-workflow"
  to = "https://ezevillo-git-review-workflow.netlify.app/"
  status = 200
  force = true

[[redirects]]
  from = "/git-review-workflow/*"
  to = "https://ezevillo-git-review-workflow.netlify.app/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/truco-a-3"
  to = "https://ezevillo-truco-a-3.netlify.app/truco-a-3/"
  status = 200
  force = true

[[redirects]]
  from = "/truco-a-3/*"
  to = "https://ezevillo-truco-a-3.netlify.app/truco-a-3/:splat"
  status = 200
  force = true
# END GENERATED ROUTES

# Shared security headers also apply to proxied responses. Keep the portfolio's
# restrictive CSP scoped to its home so each project retains its own policy.
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "DENY"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

[[headers]]
  for = "/"
  [headers.values]
    Content-Security-Policy = "default-src 'none'; style-src 'self' 'unsafe-inline'; script-src 'self' 'sha256-IO26B9PWQcAF+aNZhGJxvJdVUMsYkSPTj+KLclWfJ7Y='; img-src 'self'; font-src 'self'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'; upgrade-insecure-requests"

[[headers]]
  for = "/index.html"
  [headers.values]
    Content-Security-Policy = "default-src 'none'; style-src 'self' 'unsafe-inline'; script-src 'self' 'sha256-IO26B9PWQcAF+aNZhGJxvJdVUMsYkSPTj+KLclWfJ7Y='; img-src 'self'; font-src 'self'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'; upgrade-insecure-requests"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=86400"
